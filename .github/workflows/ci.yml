name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pyyaml
      - name: Plugin structure, agents and scope guard
        run: python -m unittest discover -s tests -v
      - name: taskgit scenarios
        run: bash tests/test_taskgit.sh
      - name: Shell syntax
        run: bash -n skills/setup-project/scripts/taskgit.sh
