name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # M2: macOS (bash 3.2, BSD tools, stock Python 3.9) is where T3 and C2 broke; test it too
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pyyaml
      - name: Plugin structure, agents, capture and scope guard
        run: python -m unittest discover -s tests -v
      - name: taskgit scenarios
        if: runner.os == 'Linux'
        run: bash tests/test_taskgit.sh
      - name: taskgit scenarios under macOS's /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          /bin/bash --version | head -1
          PATH="$RUNNER_TEMP/bash32:$PATH" /bin/bash tests/test_taskgit.sh
      - name: Shell syntax
        run: bash -n skills/setup-project/scripts/taskgit.sh && sh -n hooks/scope_guard.sh

  lint:
    # M3: manifest schema, shell and Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin manifest (claude plugin validate --strict)
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          claude plugin validate --strict .
      - name: Always-on context cost under 2,000 tokens (claude plugin details)
        run: |
          out=$(claude --plugin-dir . plugin details dev-team-setup 2>&1) || true
          echo "$out" | grep -iE "always-on|^dev-team|setup-project " || true
          n=$(echo "$out" | sed -n 's/.*Always-on: *~\([0-9,]*\) tok.*/\1/p' | tr -d ,)
          [ -n "$n" ] || { echo "couldn't read the always-on cost"; echo "$out" | head -20; exit 1; }
          echo "always-on: $n tokens"
          [ "$n" -lt 2000 ] || { echo "always-on cost $n >= 2000: the directory listing flags this"; exit 1; }
      - name: shellcheck
        run: shellcheck --severity=warning skills/setup-project/scripts/taskgit.sh hooks/scope_guard.sh tests/test_taskgit.sh
      - name: ruff
        run: |
          python -m pip install ruff
          ruff check --select E9,F,B,UP --target-version py39 hooks tools skills tests bench.py
