name: Evals

# Behaviour evals (evals/README.md). They call the model on your API key, so they run only when
# started by hand, never on push. Needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per case"
        default: "3"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code and the shell sandbox
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat >/dev/null
      - name: Run the suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: sh evals/run.sh --runs "${{ inputs.runs }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
